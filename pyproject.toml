[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cial-knowledge-os"
version = "0.1.0"
description = "Offline-first enterprise RAG system for CIAL Knowledge OS"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cial_knowledge_os = ["assets/*"]
